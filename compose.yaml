services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcadia-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_CODE_TTL_MINUTES: ${MFA_CODE_TTL_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Arcadia Vault <no-reply@arcadia.local>}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - arcadia_rooms_data:/app/rooms
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    container_name: arcadia-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - arcadia_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  arcadia_mariadb_data:
    name: arcadia_mariadb_data
  arcadia_rooms_data:
    name: arcadia_rooms_data
