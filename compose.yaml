services:
  mariadb:
    image: mariadb:11.8
    container_name: arcadia-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - arcadia_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  arcadia_mariadb_data:
    name: arcadia_mariadb_data
